<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1200" viewBox="0 0 400 1200" fill="none">
  <!-- Grid Pattern -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.1" opacity="0.2"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#smallGrid)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Trajectories and Curves (Seamless) -->
  <path d="M -50,400 Q 150,100 450,200" stroke="white" stroke-width="0.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
  <path d="M -50,700 Q 200,400 450,550" stroke="white" stroke-width="0.5" stroke-dasharray="2 6" fill="none" opacity="0.4"/>
  <path d="M -50,1000 Q 250,700 450,850" stroke="white" stroke-width="0.5" stroke-dasharray="8 4" fill="none" opacity="0.4"/>
  
  <path d="M 50,0 Q 100,600 50,1200" stroke="white" stroke-width="0.3" fill="none" opacity="0.4"/>
  <path d="M 350,0 Q 300,600 350,1200" stroke="white" stroke-width="0.3" stroke-dasharray="4 8" fill="none" opacity="0.3"/>
  <path d="M 150,0 Q 200,600 150,1200" stroke="white" stroke-width="0.2" stroke-dasharray="2 4" fill="none" opacity="0.2"/>
  
  <!-- Circles and Target Nodes -->
  <circle cx="150" cy="200" r="40" stroke="white" stroke-width="0.3" stroke-dasharray="2 2" opacity="0.5"/>
  <circle cx="150" cy="200" r="10" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <circle cx="150" cy="200" r="2" fill="white" opacity="0.8"/>
  
  <circle cx="300" cy="500" r="80" stroke="white" stroke-width="0.2" opacity="0.4"/>
  <circle cx="300" cy="500" r="60" stroke="white" stroke-width="0.4" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="300" cy="500" r="3" fill="white" opacity="0.6"/>
  <circle cx="240" cy="500" r="2" fill="white" opacity="0.6"/>
  
  <circle cx="100" cy="800" r="120" stroke="white" stroke-width="0.2" stroke-dasharray="1 3" opacity="0.5"/>
  <circle cx="100" cy="800" r="20" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="800" r="2" fill="white" opacity="0.8"/>
  
  <circle cx="250" cy="1000" r="50" stroke="white" stroke-width="0.3" opacity="0.4"/>
  
  <!-- Linear Scales / Rulers (Seamless from 0 to 1200) -->
  <g opacity="0.6">
    <line x1="380" y1="0" x2="380" y2="1200" stroke="white" stroke-width="0.5" />
    <path d="M 375,0 L 380,0 M 377,50 L 380,50 M 375,100 L 380,100 M 377,150 L 380,150 
             M 375,200 L 380,200 M 377,250 L 380,250 M 375,300 L 380,300 M 377,350 L 380,350 
             M 375,400 L 380,400 M 377,450 L 380,450 M 375,500 L 380,500 M 377,550 L 380,550 
             M 375,600 L 380,600 M 377,650 L 380,650 M 375,700 L 380,700 M 377,750 L 380,750 
             M 375,800 L 380,800 M 377,850 L 380,850 M 375,900 L 380,900 M 377,950 L 380,950 
             M 375,1000 L 380,1000 M 377,1050 L 380,1050 M 375,1100 L 380,1100 M 377,1150 L 380,1150
             M 375,1200 L 380,1200" 
          stroke="white" stroke-width="0.5" />
    <text x="360" y="202" fill="white" font-family="monospace" font-size="8">80</text>
    <text x="360" y="402" fill="white" font-family="monospace" font-size="8">60</text>
    <text x="360" y="602" fill="white" font-family="monospace" font-size="8">40</text>
    <text x="360" y="802" fill="white" font-family="monospace" font-size="8">20</text>
    <text x="360" y="1002" fill="white" font-family="monospace" font-size="8">00</text>
  </g>
  
  <g opacity="0.6">
    <line x1="20" y1="0" x2="20" y2="1200" stroke="white" stroke-width="0.5" stroke-dasharray="2 2" />
    <text x="25" y="255" fill="white" font-family="monospace" font-size="8">Y-AXIS</text>
    <text x="25" y="855" fill="white" font-family="monospace" font-size="8">Y-AXIS</text>
  </g>

  <!-- Crosshairs -->
  <g stroke="white" stroke-width="0.5" opacity="0.7">
    <path d="M 90,350 L 110,350 M 100,340 L 100,360" />
    <path d="M 290,150 L 310,150 M 300,140 L 300,160" />
    <path d="M 40,650 L 60,650 M 50,640 L 50,660" />
    <path d="M 240,750 L 260,750 M 250,740 L 250,760" />
    <path d="M 320,950 L 340,950 M 330,940 L 330,960" />
    <path d="M 190,1100 L 210,1100 M 200,1090 L 200,1110" />
  </g>
  
  <!-- UI Text / Data Points -->
  <text x="20" y="50" fill="white" font-family="monospace" font-size="8" opacity="0.7">17.3850 N</text>
  <text x="20" y="65" fill="white" font-family="monospace" font-size="8" opacity="0.7">78.4867 E</text>
  <path d="M 20,75 L 60,75 M 65,75 L 80,75 M 85,75 L 90,75" stroke="white" stroke-width="0.5" opacity="0.5"/>
  
  <text x="20" y="450" fill="white" font-family="monospace" font-size="8" opacity="0.7">LAUNCH SEQUENCE</text>
  <path d="M 20,435 L 25,435 L 25,440 M 110,435 L 105,435 L 105,440" stroke="white" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 20,455 L 25,455 L 25,450 M 110,455 L 105,455 L 105,450" stroke="white" stroke-width="0.5" fill="none" opacity="0.5"/>
  
  <text x="280" y="300" fill="white" font-family="monospace" font-size="8" opacity="0.7">PHASE 01</text>
  <path d="M 280,310 L 330,310" stroke="white" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
  
  <text x="20" y="850" fill="white" font-family="monospace" font-size="8" opacity="0.7">VECTOR: 01</text>
  <text x="20" y="865" fill="white" font-family="monospace" font-size="7" opacity="0.5">X 45.62</text>
  <text x="20" y="875" fill="white" font-family="monospace" font-size="7" opacity="0.5">Y 78.12</text>
  <text x="20" y="885" fill="white" font-family="monospace" font-size="7" opacity="0.5">Z 12.09</text>
  <path d="M 20,895 L 80,895" stroke="white" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/>
</svg>
